name: CI Pipeline

on:
  push:
    branches:
      - main
      - v2
      - "ntk-thesis-*"
  pull_request:
    branches:
      - main
      - v2
      - "ntk-thesis-*"

jobs:
  sast-scientific-safety-and-cpu-tests:
    name: Scientific Safety Invariants & CPU Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Lightweight Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml pydantic

      - name: Syntax & Compilation Checks (Zero-Defect Guarantee)
        run: |
          python -m py_compile simple_semgrepAI/semgrepai/scoring/sast_scoring_engine.py
          python -m py_compile simple_semgrepAI/semgrepai/llm/local_lora_verifier.py
          python -m py_compile simple_semgrepAI/semgrepai/html_dashboard.py
          python -m py_compile simple_semgrepAI/run_operation_pipeline.py

      - name: Run SAST Scoring Safety Invariants Unit Tests
        run: |
          python tests/test_sast_scoring_safety.py

      - name: Verify Local-Only Privacy Fail-Closed Guarantee
        run: |
          python -c "
          import os, sys
          os.environ['THESIS_LOCAL_ONLY_MODE'] = 'true'
          sys.path.insert(0, 'simple_semgrepAI')
          from semgrepai.llm.providers import LLMFactory, LLMProviderConfig
          try:
              LLMFactory.create_llm(LLMProviderConfig(provider='openai', model='gpt-4o'))
              raise AssertionError('Failed closed check: Cloud provider was allowed!')
          except PermissionError as e:
              print('[PASS] Cloud provider blocked under local-only privacy mode:', e)
          "

      - name: Verify Environment Checksums
        run: |
          sha256sum -c checksums.sha256

  verify-docker:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: sast-scientific-safety-and-cpu-tests
    env:
      CONDA_PLUGINS_AUTO_ACCEPT_TOS: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f Dockerfile --platform linux/x86_64 -t iris:latest .

      - name: Run image
        run: docker run --platform=linux/amd64 iris:latest

  get-projects:
    runs-on: ubuntu-latest
    needs: sast-scientific-safety-and-cpu-tests
    outputs:
      projects: ${{ steps.read-json.outputs.projects }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read projects and parameters from JSON
        id: read-json
        run: |
          JSON_FILE=".github/workflows/to_build.json"
          PROJECTS_JSON=$(cat "$JSON_FILE" | jq -c .)
          echo "Detected projects and parameters: $PROJECTS_JSON"
          echo "projects=$PROJECTS_JSON" >> $GITHUB_OUTPUT

  build-and-analyze:
    needs: get-projects
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.get-projects.outputs.projects) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          auto-activate-base: false
          activate-environment: iris
          auto-update-conda: true

      - name: Set up Java version ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}

      - name: Install Maven ${{ matrix.maven_version }}
        if: ${{ matrix.maven_version != '' }}
        run: |
          MAVEN_VERSION="${{ matrix.maven_version }}"
          MAVEN_TAR="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          MAVEN_URL="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/${MAVEN_TAR}"
          MAVEN_INSTALL_DIR="/opt/maven/apache-maven-${MAVEN_VERSION}"
          sudo curl -fSL "$MAVEN_URL" -o "/tmp/${MAVEN_TAR}" || { echo "Failed to download Maven!"; exit 1; }
          sudo mkdir -p "${MAVEN_INSTALL_DIR}"
          sudo tar -xzf "/tmp/${MAVEN_TAR}" -C "${MAVEN_INSTALL_DIR}" --strip-components=1
          echo "${MAVEN_INSTALL_DIR}/bin" >> $GITHUB_PATH
